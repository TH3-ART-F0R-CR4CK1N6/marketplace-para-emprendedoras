{% extends "base.html" %}

{% block content %}
<div class="container" style="padding: 2rem 0;">
    <div class="form-container" style="max-width: 800px;">
        <h2>Editar Usuario: {{ user.username }}</h2>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="form-grid">
                <div class="form-group">
                    <label for="username">Nombre de Usuario *</label>
                    <input type="text" id="username" name="username" value="{{ user.username }}" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="role">Rol *</label>
                <select id="role" name="role" required>
                    <option value="cliente" {% if user.role == 'cliente' %}selected{% endif %}>Cliente</option>
                    <option value="emprendedora" {% if user.role == 'emprendedora' %}selected{% endif %}>Emprendedora</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrador</option>
                </select>
            </div>
            
            <hr style="margin: 2rem 0; border: 1px solid #e5e7eb;">
            
            <h3 style="color: #1f2937; margin-bottom: 1rem;">Información de Contacto</h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="+1 234 567 8900">
                </div>
                
                <div class="form-group">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" value="{{ user.whatsapp or '' }}" placeholder="+1 234 567 8900">
                </div>
            </div>
            
            <div class="form-group">
                <label for="address">Dirección</label>
                <input type="text" id="address" name="address" value="{{ user.address or '' }}" placeholder="Calle, Ciudad, País">
            </div>
            
            <div class="form-group">
                <label for="bio">Biografía / Descripción</label>
                <textarea id="bio" name="bio" rows="3" placeholder="Cuéntanos sobre ti o tu negocio...">{{ user.bio or '' }}</textarea>
            </div>
            
            <hr style="margin: 2rem 0; border: 1px solid #e5e7eb;">
            
            <h3 style="color: #1f2937; margin-bottom: 1rem;">Redes Sociales</h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="facebook">Facebook</label>
                    <input type="url" id="facebook" name="facebook" value="{{ user.facebook or '' }}" placeholder="https://facebook.com/usuario">
                </div>
                
                <div class="form-group">
                    <label for="instagram">Instagram</label>
                    <input type="url" id="instagram" name="instagram" value="{{ user.instagram or '' }}" placeholder="https://instagram.com/usuario">
                </div>
            </div>
            
            <div class="form-group">
                <label for="twitter">Twitter / X</label>
                <input type="url" id="twitter" name="twitter" value="{{ user.twitter or '' }}" placeholder="https://twitter.com/usuario">
            </div>
            
            <hr style="margin: 2rem 0; border: 1px solid #e5e7eb;">
            
            <h3 style="color: #1f2937; margin-bottom: 1rem;">Cambiar Contraseña</h3>
            <p style="color: #6b7280; margin-bottom: 1rem; font-size: 0.9rem;">Deja este campo vacío si no deseas cambiar la contraseña</p>
            
            <div class="form-group">
                <label for="new_password">Nueva Contraseña</label>
                <input type="password" id="new_password" name="new_password" placeholder="********">
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-success">Guardar Cambios</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<style>
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}
