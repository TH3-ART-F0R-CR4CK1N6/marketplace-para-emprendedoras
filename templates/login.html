{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2>Iniciar Sesión</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-success">Iniciar Sesión</button>
            </div>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-gray);">
            ¿No tienes cuenta? <a href="{{ url_for('register') }}" style="color: var(--primary-purple); font-weight: 600;">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}
