{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2>Crear Cuenta</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="role">Tipo de Cuenta</label>
                <select id="role" name="role" required>
                    <option value="cliente">Cliente</option>
                    <option value="emprendedora">Emprendedora</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-success">Registrarse</button>
            </div>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-gray);">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: var(--primary-purple); font-weight: 600;">Inicia sesión aquí</a>
        </p>
    </div>
</div>
{% endblock %}
